<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro/FocusBlocker</title>
</head>
<body>
    <h1>Hello world!</h1>

    <input type="text" id="domainInput" placeholder="e.g. youtube.com" />
    <button id="addBtn">Block site</button>
    <ul id="list"></ul>


    <div style="height: 200px;width: 200px;background-color: red;">
        <h1 style="position: relative; top: 30%;left: 20%;" id="time">00:00</h1>
        <button id="addTime25min"style="position: relative; top: 70%;left: 10%;">add 25 mins</button>
        <button id="addTime5min"style="position: relative; top: 70%;left: 10%;">add 5 mins</button>
        <button id="reset"style="position: relative; top: 70%;left: 10%;">reset</button>
    </div>

    <script src="index.js"></script>
    <script src="pomodoro.js"></script>
</body>
</html>
